<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produto - Tech Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Tech Store</a>
        <div>
          <a
            class="btn btn-outline-light btn-sm me-2"
            href="login.html"
            id="statusConta"
            aria-label="Entrar"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span class="rotulo">Entrar</span>
          </a>
          <a class="btn btn-primary btn-sm" href="carrinho.html">Carrinho</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div id="produto"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/session.js" type="module"></script>
    <script>
      async function load() {
        const productId = new URLSearchParams(location.search).get("id");
        const product = await api("/produtos/detalhes.php?id=" + productId);

        document.getElementById("produto").innerHTML = `
					<h1>${product.name}</h1>
					<p>${product.description}</p>
					<h2>R$ ${Number(product.price).toFixed(2).replace(".", ",")}</h2>
					<p>Estoque: ${product.stock}</p>
					<input
						id="q"
						type="number"
						min="1"
						max="${product.stock}"
						value="1"
						class="form-control mb-3"
						style="max-width: 120px"
					>
					<button
						class="btn btn-dark"
						onclick="add(${product.id})"
						${product.stock < 1 ? "disabled" : ""}
					>
						Adicionar ao carrinho
					</button>
				`;
      }

      async function add(id) {
        try {
          await api("/carrinho/adicionar.php", {
            method: "POST",
            body: JSON.stringify({
              product_id: id,
              quantity: Number(q.value),
            }),
          });
          location.href = "carrinho.html";
        } catch (error) {
          if (error.message.includes("login")) {
            location.href = "login.html";
          } else {
            alert(error.message);
          }
        }
      }

      load();
    </script>
  </body>
</html>
