<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar - Tech Store</title>
    <link rel="stylesheet" href="css/style.css" />
<link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    /> 
  </head>
  <body>
    <header class="header">
    
      <div class="container header-topo">
        <a href="index.html" class="logo" aria-label="Tech Store - página inicial">
          <svg height="34" width="150" viewBox="0 0 212 48" role="img" aria-label="Tech Store">
            <path d="M17 16V12.5a7 7 0 0 1 14 0V16" fill="none" stroke="#0B1020" stroke-width="3.5" stroke-linecap="round"/>
            <rect x="7" y="15" width="34" height="28" rx="8" fill="#2F5BFF"/>
            <path d="M16 24.5h16M24 24.5v6" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="24" cy="35.5" r="2.75" fill="#C6F432"/>
            <text x="54" y="36" font-family="Manrope, Arial, sans-serif" font-size="28" letter-spacing="-1">
              <tspan font-weight="800" fill="#0B1020">tech</tspan><tspan font-weight="500" fill="#2F5BFF">store</tspan>
            </text>
          </svg>
        </a>

        <nav class="conta" aria-label="Conta">
          <a class="btn-conta" href="login.html" aria-label="Entrar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="rotulo">Entrar</span>
          </a>
          <a class="btn-conta" href="carrinho.html" aria-label="Carrinho">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span class="rotulo">Carrinho</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="container py-5" style="max-width: 480px">
      <div class="card shadow-sm p-4">
        <h2>Entrar na Tech Store</h2>
        <form id="login">
          <input
            id="email"
            type="email"
            class="form-control mb-3"
            placeholder="E-mail"
            required
          />
          <input
            id="password"
            type="password"
            class="form-control mb-3"
            placeholder="Senha"
            required
          />
          <button class="btn btn-dark w-100">Entrar</button>
        </form>
        <p class="mt-3 mb-0">
          Não possui conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
        <div id="msg" class="mt-3"></div>
      </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
