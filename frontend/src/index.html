<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tech Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===== CABEÇALHO ===== -->
    <header class="header">
      <div class="container header-topo">
        <a
          href="index.html"
          class="logo"
          aria-label="Tech Store - página inicial"
        >
          <svg
            height="34"
            width="150"
            viewBox="0 0 212 48"
            role="img"
            aria-label="Tech Store"
          >
            <path
              d="M17 16V12.5a7 7 0 0 1 14 0V16"
              fill="none"
              stroke="#0B1020"
              stroke-width="3.5"
              stroke-linecap="round"
            />
            <rect x="7" y="15" width="34" height="28" rx="8" fill="#2F5BFF" />
            <path
              d="M16 24.5h16M24 24.5v6"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="3.5"
              stroke-linecap="round"
            />
            <circle cx="24" cy="35.5" r="2.75" fill="#C6F432" />
            <text
              x="54"
              y="36"
              font-family="Manrope, Arial, sans-serif"
              font-size="28"
              letter-spacing="-1"
            >
              <tspan font-weight="800" fill="#0B1020">tech</tspan>
              <tspan font-weight="500" fill="#2F5BFF">store</tspan>
            </text>
          </svg>
        </a>

      <form class="busca btnbar01"  id="busca" role="search" id="formBusca">
        <label for="busca" class="sr-only">Buscar produtos</label>
        <svg class="busca-icone" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="search" placeholder="Buscar smartphones, notebooks, fones…">
      </form>

        <nav class="conta" aria-label="Conta">
          <button class="btn-conta" type="button" id="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4" />
            </svg>
            <span class="rotulo">Buscar</span>
          </button>

        <button class="btn-conta btnsearch" type="button" id="search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
          </svg>
          <span class="rotulo">Buscar</span>
        </button>

      <nav
        class="container menu-categorias"
        id="menuCategorias"
        aria-label="Categorias"
      >
        <a href="#produtos" data-category-id="">Todas as categorias</a>
      </nav>
    </header>

    <main class="container py-5">
      <div
        class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"
      >
        <div>
          <h1 class="h2 mb-1">Tecnologia para o seu dia a dia</h1>
          <p class="text-muted mb-0">Encontre seu próximo produto favorito.</p>
        </div>
      </div>
      <section
        id="produtos"
        class="row g-4"
        aria-live="polite"
        aria-label="Produtos"
      ></section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/produtos.js"></script>
  </body>
</html>
