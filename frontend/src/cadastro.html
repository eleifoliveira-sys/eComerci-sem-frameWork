<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro - Tech Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Tech Store</a>
        <div>
          <a class="btn btn-outline-light btn-sm me-2" href="login.html"
            >Entrar</a
          >
          <a class="btn btn-primary btn-sm" href="carrinho.html">Carrinho</a>
        </div>
      </div>
    </nav>

    <main class="container py-5" style="max-width: 480px">
      <div class="card shadow-sm p-4">
        <h2>Criar conta</h2>
        <form id="cadastro">
          <input
            id="name"
            class="form-control mb-3"
            placeholder="Nome"
            required
          />
          <input
            id="email"
            type="email"
            class="form-control mb-3"
            placeholder="E-mail"
            required
          />
          <input
            id="password"
            type="password"
            class="form-control mb-3"
            placeholder="Senha"
            required
          />
          <button class="btn btn-dark w-100">Cadastrar</button>
        </form>
        <div id="msg" class="mt-3"></div>
      </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
