<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto - Tech Store</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-5"><div id="produto"></div></main><script src="js/api.js"></script><script>async function load(){const p=await api('/produtos/detalhes.php?id='+new URLSearchParams(location.search).get('id'));document.getElementById('produto').innerHTML=`<h1>${p.name}</h1><p>${p.description}</p><h2>R$ ${Number(p.price).toFixed(2).replace('.',',')}</h2><p>Estoque: ${p.stock}</p><input id="q" type="number" min="1" max="${p.stock}" value="1" class="form-control mb-3" style="max-width:120px"><button class="btn btn-dark" onclick="add(${p.id})" ${p.stock<1?'disabled':''}>Adicionar ao carrinho</button>`}async function add(id){try{await api('/carrinho/adicionar.php',{method:'POST',body:JSON.stringify({product_id:id,quantity:Number(q.value)})});location.href='carrinho.html'}catch(e){if(e.message.includes('login'))location.href='login.html';else alert(e.message)}}load();</script></body></html>
